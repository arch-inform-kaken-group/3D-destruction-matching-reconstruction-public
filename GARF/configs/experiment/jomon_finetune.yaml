# @package _global_
defaults:
  - denoiser_flow_matching
  - override /data: jomon
  - override /loggers: csv
  - _self_

project_name: GARF-Jomon
experiment_name: jomon_finetune_${now:%Y-%m-%d_%H-%M-%S}
tags: ["jomon", "finetune", "lora"]

data:
  pottery_dir: ???            # pass via CLI: data.pottery_dir=...
  batch_size: 4
  num_workers: 4
  held_out: 10

trainer:
  max_epochs: 500
  check_val_every_n_epoch: 10
  log_every_n_steps: 1
  accumulate_grad_batches: 2

model:
  # GARF.ckpt bundles the feature extractor, so leave this null;
  # train.py loads the full state_dict from ckpt_path.
  feature_extractor_ckpt: null
  lora_config:
    _target_: peft.LoraConfig
    r: 128
    lora_alpha: 256
    lora_dropout: 0.1
    # self-attn + global-attn (+ff/norm) across transformer layers (paper Sec 3.4)
    target_modules: "transformer_layers\\.\\d+\\.(self_attn_to_qkv|self_attn_to_out\\.0|global_attn_to_qkv|global_attn_to_out\\.0|ff\\.net\\.2|norm\\d+\\.(linear|timestep_embbedder\\.(linear_1|linear_2)))"
    modules_to_save: ["mlp_out_trans", "mlp_out_rot", "shape_embedding"]

ckpt_path: ???              # pass via CLI: ckpt_path=.../GARF.ckpt
finetuning: true